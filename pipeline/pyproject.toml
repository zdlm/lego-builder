[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lego-builder"
version = "0.1.0"
description = "Turn LEGO instruction PDFs into beat-synced social media videos"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "librosa>=0.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
lego-builder = "lego_builder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lego_builder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
